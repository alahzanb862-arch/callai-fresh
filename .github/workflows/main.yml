      - name: Build Debug APK
        run: |
          GRADLE_FILE=$(find extracted_proj -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "No build.gradle or build.gradle.kts found in zip!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain | grep -E "e: |FAILURE:|Execution failed|Could not|Unresolved|error:|exception" -A 3 -B 1 || ./gradlew assembleDebug --console=plain
          
